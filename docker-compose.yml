services:
  db:
    image: postgres:17-alpine
    container_name: etnomk-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - etnomk-postgres-data:/var/lib/postgresql/data
    networks:
      etnomk-network:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: etnomk:local
    container_name: etnomk-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ETNOMK_SECURITY_JWT_SECRET: ${ETNOMK_SECURITY_JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - etnomk-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: etnomk-frontend:local
    container_name: etnomk-frontend
    depends_on:
      - app
    ports:
      - "5173:80"
    networks:
      - etnomk-network

volumes:
  etnomk-postgres-data:

networks:
  etnomk-network:
