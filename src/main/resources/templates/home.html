<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(~{::main}, 'Home - EtnoMK')}">
<head>
    <style>
        .hero {
            background-color: #f5f5f5;
            padding: 3rem 0;
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h2 {
            font-size: 2.5rem;
            color: #8B4513;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 2rem;
            color: #8B4513;
            margin-bottom: 2rem;
            text-align: center;
        }

        .no-records {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
    </style>
</head>
<body>
<main th:fragment="content">

    <div class="hero">
        <h2>Welcome to EtnoMK</h2>
        <p>Explore the rich cultural heritage and traditional items of Macedonia</p>
        <div class="cta-buttons">
            <a href="/records/view" class="btn btn-primary">Browse Records</a>
            <a href="/records/create" class="btn btn-secondary">Add Your Item</a>
        </div>
    </div>

    <h2 class="section-title">Recent Records</h2>

    <div th:if="${records.isEmpty()}" class="no-records">
        <p>No records found. Be the first to add one!</p>
    </div>

    <div class="grid" th:unless="${records.isEmpty()}">
        <div class="record-card" th:each="record : ${records.stream().limit(6).toList()}">
            <div class="record-image">
                <img th:if="${record.images} and ${not record.images.isEmpty()}"
                     th:src="${record.images[0].imagePath}"
                     th:alt="${record.title}">
                <span th:unless="${record.images} and ${not record.images.isEmpty()}">No Image</span>
            </div>
            <div class="record-content">
                <h3 th:text="${record.title}">Title</h3>
                <div class="record-meta">
                    <p th:text="${record.category.name}">Category</p>
                    <p th:text="${record.region.name}">Region</p>
                </div>
                <a th:href="@{/records/{id}(id=${record.recordId})}">View Details →</a>
            </div>
        </div>
    </div>

    <div style="text-align: center; margin-bottom: 3rem;">
        <a href="/records/view" class="btn btn-primary">View All Records</a>
    </div>

</main>
</body>
</html>
