spring.application.name="add_application_name_here"

# PostgreSQL Database Configuration
spring.datasource.url="add_database_url_here"
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username="add_username_here"
spring.datasource.password="add_password_here"

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# NOTE: Remove H2-console config when using PostgreSQL in production
# spring.h2.console.enabled=false
# spring.h2.console.path=/h2-console

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
